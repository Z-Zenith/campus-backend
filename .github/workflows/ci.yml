name: Backend API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-api-build:
    runs-on: ubuntu-latest
    # The OpenAPI-snapshot step below runs the real app host (ASPNETCORE_ENVIRONMENT=
    # Development), which starts every registered IHostedService — including
    # DevSeedHostedService and FeeReminderHostedService, both of which open a real
    # AppDbContext connection at startup. Nothing in this job previously provisioned a
    # database, so that step failed with "Connection refused" on 127.0.0.1:5432 on every
    # run, unrelated to whatever the PR actually changed. Matches db/README.md's documented
    # local connection (Host=localhost;Port=5432;Database=campus;Username=campus;
    # Password=campus_dev), which appsettings.json's committed dev placeholder also uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus_dev
          POSTGRES_DB: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Service containers start before checkout, so db/init/*.sql can't be mounted in via
      # docker-entrypoint-initdb.d (the usual local/docker-compose path, see db/README.md) —
      # applied explicitly here instead, now that the files actually exist on the runner.
      # 03_create_app_role.sh (the campus_app role) is compose-only, not needed here since
      # this job connects as the campus superuser, same as bare `dotnet run` per
      # db/README.md.
      - name: Apply DB schema
        env:
          PGPASSWORD: campus_dev
        run: |
          psql -h localhost -U campus -d campus -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
          psql -h localhost -U campus -d campus -v ON_ERROR_STOP=1 -f db/init/02_seed_roles_and_permissions.sql

      # Regenerate the committed OpenAPI snapshot from the current code and fail if it
      # drifted (Contracts/README.md documents this exact command). The generator builds
      # the app host to introspect routes, which trips Program.cs's fail-fast dev-placeholder
      # guard (#137) unless ASPNETCORE_ENVIRONMENT=Development — the tracked
      # appsettings.Development.json supplies the dev Jwt:Key so this runs headless.
      - name: Regenerate OpenAPI snapshot & check for drift
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet build -p:OpenApiGenerateDocumentsOnBuild=true
          git diff --exit-code -- Contracts/openapi.snapshot.json \
            || { echo "::error::Contracts/openapi.snapshot.json is stale. Run 'ASPNETCORE_ENVIRONMENT=Development dotnet build -p:OpenApiGenerateDocumentsOnBuild=true' and commit the result."; exit 1; }

      - name: Test
        run: dotnet test BackendApi.Tests -c Release

      - name: Check for vulnerable NuGet packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.log
          if grep -q "has the following vulnerable packages" vuln.log; then
            echo "::error::Vulnerable NuGet package(s) detected"
            exit 1
          fi
